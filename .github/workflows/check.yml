name: Checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      release-tag:
        description: Version tag to validate and build for release
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check extension version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            npm run version:check -- "$RELEASE_TAG"
          else
            npm run version:check
          fi
      - run: npm ci
      - run: npm test
      # Pinned Playwright installs Chromium with the Extensions.triggerAction CDP command.
      - name: Install Chromium for extension tests
        run: npx --no-install playwright install --with-deps chromium --no-shell
      - name: Build and run browser tests
        run: npm run test:browser
      - name: Keep tested extension for release
        if: inputs.release-tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: tmp/browser/*.*
