name: Release

on:
  push:
    branches: ['main']
    tags: ['v*']
    paths:
      - package.json
      - package-lock.json
      - manifest.json
      - .github/workflows/release.yml
      - scripts/release.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      publish: ${{ steps.plan.outputs.publish }}
      tag-exists: ${{ steps.plan.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Plan version release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs

  checks:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/check.yml
    with:
      release-tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, checks]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Download tested extension
        uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: dist
      - name: Package extension
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f dist/manifest.json
          cd dist
          zip -q -r "../Sider-${RELEASE_TAG}.zip" .
          cd ..
          unzip -t "Sider-${RELEASE_TAG}.zip"
          sha256sum "Sider-${RELEASE_TAG}.zip" > "Sider-${RELEASE_TAG}.zip.sha256"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_EXISTS: ${{ needs.prepare.outputs.tag-exists }}
        run: |
          if [ "$TAG_EXISTS" != 'true' ]; then
            gh api "repos/$GH_REPO/git/refs" --method POST \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_SHA" > /dev/null
          fi
          gh release create "$RELEASE_TAG" \
            "Sider-${RELEASE_TAG}.zip" \
            "Sider-${RELEASE_TAG}.zip.sha256" \
            --verify-tag \
            --title "Sider ${RELEASE_TAG}" \
            --generate-notes
