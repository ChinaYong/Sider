name: Checks
on:
  push:
  pull_request:
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Pinned Playwright installs Chromium with the Extensions.triggerAction CDP command.
      - name: Install Chromium for extension tests
        run: npx --no-install playwright install --with-deps chromium --no-shell
      - name: Build and run browser tests
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: tmp/browser/*.*
